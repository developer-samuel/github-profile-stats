name: Update README
description: Replaces img tags with responsive <picture> elements in README

inputs:
  output_dir:
    required: false
    default: 'assets'
  readme_path:
    required: false
    default: 'README.md'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        INPUT_README_PATH: ${{ inputs.readme_path }}
      run: |
        if [ -n "$INPUT_README_PATH" ]; then
          python3 ${{ github.action_path }}/../../src/update_readme.py
        fi
