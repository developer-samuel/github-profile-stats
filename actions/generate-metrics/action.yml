name: Generate Metrics SVG
description: Generates the metrics SVG card (streaks, highest/avg commits per day)

inputs:
  token:
    required: true
  username:
    required: true
  output_dir:
    required: false
    default: 'assets'
  theme:
    required: false
    default: 'dark'
  primary_color:
    required: false
    default: ''
  bg_color:
    required: false
    default: ''
  text_color:
    required: false
    default: ''
  muted_color:
    required: false
    default: ''
  divider_color:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_PRIMARY_COLOR: ${{ inputs.primary_color }}
        INPUT_BG_COLOR: ${{ inputs.bg_color }}
        INPUT_TEXT_COLOR: ${{ inputs.text_color }}
        INPUT_MUTED_COLOR: ${{ inputs.muted_color }}
        INPUT_DIVIDER_COLOR: ${{ inputs.divider_color }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
      run: PYTHONPATH=${{ github.action_path }}/../../src python3 ${{ github.action_path }}/../../src/metrics/generate.py
