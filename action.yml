name: GitHub Stats Generator
description: Generates dark-themed SVG stats and metrics cards for your GitHub profile README.
author: developer-samuel

inputs:
  token:
    description: GitHub token (PAT with public_repo + read:user scopes)
    required: true
  username:
    description: GitHub username
    required: true
  output_dir:
    description: Base output directory - stats/ and metrics/ subfolders are created automatically
    required: false
    default: 'assets'
  start_date:
    description: Date you started programming in YYYY-MM-DD format (optional - if omitted, years experience stat is hidden)
    required: false
    default: ''
  theme:
    description: Color theme - "dark" or "light" (individual color inputs override theme)
    required: false
    default: 'dark'
  primary_color:
    description: Primary accent color (hex) - overrides theme
    required: false
    default: ''
  bg_color:
    description: Background color (hex) - overrides theme
    required: false
    default: ''
  text_color:
    description: Secondary text color (hex) - overrides theme
    required: false
    default: ''
  muted_color:
    description: Muted label color (hex) - overrides theme
    required: false
    default: ''
  divider_color:
    description: Divider line color (hex) - overrides theme
    required: false
    default: ''
  readme_path:
    description: Path to the README file to auto-update with responsive <picture> elements (set to '' to skip)
    required: false
    default: 'README.md'

runs:
  using: composite
  steps:
    - uses: ./actions/generate-stats
      with:
        token: ${{ inputs.token }}
        username: ${{ inputs.username }}
        start_date: ${{ inputs.start_date }}
        output_dir: ${{ inputs.output_dir }}
        theme: ${{ inputs.theme }}
        primary_color: ${{ inputs.primary_color }}
        bg_color: ${{ inputs.bg_color }}
        text_color: ${{ inputs.text_color }}
        muted_color: ${{ inputs.muted_color }}
        divider_color: ${{ inputs.divider_color }}

    - uses: ./actions/generate-metrics
      with:
        token: ${{ inputs.token }}
        username: ${{ inputs.username }}
        output_dir: ${{ inputs.output_dir }}
        theme: ${{ inputs.theme }}
        primary_color: ${{ inputs.primary_color }}
        bg_color: ${{ inputs.bg_color }}
        text_color: ${{ inputs.text_color }}
        muted_color: ${{ inputs.muted_color }}
        divider_color: ${{ inputs.divider_color }}

    - uses: ./actions/update-readme
      with:
        output_dir: ${{ inputs.output_dir }}
        readme_path: ${{ inputs.readme_path }}

branding:
  icon: bar-chart-2
  color: green
