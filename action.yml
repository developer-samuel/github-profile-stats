name: GitHub Profile Stats
description: Generates dark-themed SVG stats and metrics cards for your GitHub profile README.
author: developer-samuel

inputs:
  token:
    description: GitHub token (PAT with public_repo + read:user scopes)
    required: true
  username:
    description: GitHub username
    required: true
  start_date:
    description: Date you started programming in YYYY-MM-DD format (optional - if omitted, years experience stat is hidden)
    required: false
    default: ''
  theme:
    description: Color theme - "dark" or "light" (individual color inputs override theme)
    required: false
    default: 'dark'
  primary_color:
    description: Primary accent color (hex) - overrides theme
    required: false
    default: ''
  bg_color:
    description: Background color (hex) - overrides theme
    required: false
    default: ''
  text_color:
    description: Secondary text color (hex) - overrides theme
    required: false
    default: ''
  muted_color:
    description: Muted label color (hex) - overrides theme
    required: false
    default: ''
  divider_color:
    description: Divider line color (hex) - overrides theme
    required: false
    default: ''
  stats_file:
    description: Output path for stats SVG - omit to skip stats generation
    required: false
    default: ''
  metrics_file:
    description: Output path for metrics SVG - omit to skip metrics generation
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate inputs
      if: ${{ inputs.stats_file == '' && inputs.metrics_file == '' }}
      shell: bash
      run: |
        echo "::error::At least one of stats_file or metrics_file must be set."
        exit 1

    - name: Generate stats SVG
      if: ${{ inputs.stats_file != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_START_DATE: ${{ inputs.start_date }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_PRIMARY_COLOR: ${{ inputs.primary_color }}
        INPUT_BG_COLOR: ${{ inputs.bg_color }}
        INPUT_TEXT_COLOR: ${{ inputs.text_color }}
        INPUT_MUTED_COLOR: ${{ inputs.muted_color }}
        INPUT_DIVIDER_COLOR: ${{ inputs.divider_color }}
        INPUT_STATS_FILE: ${{ inputs.stats_file }}
      run: PYTHONPATH=${{ github.action_path }}/src python3 ${{ github.action_path }}/src/stats/generate.py

    - name: Generate metrics SVG
      if: ${{ inputs.metrics_file != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_PRIMARY_COLOR: ${{ inputs.primary_color }}
        INPUT_BG_COLOR: ${{ inputs.bg_color }}
        INPUT_TEXT_COLOR: ${{ inputs.text_color }}
        INPUT_MUTED_COLOR: ${{ inputs.muted_color }}
        INPUT_DIVIDER_COLOR: ${{ inputs.divider_color }}
        INPUT_METRICS_FILE: ${{ inputs.metrics_file }}
      run: PYTHONPATH=${{ github.action_path }}/src python3 ${{ github.action_path }}/src/metrics/generate.py

branding:
  icon: bar-chart-2
  color: green
